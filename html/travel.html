<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>旅行足迹 | Maggie Chai</title>
  <meta name="description" content="Travel footprint of Maggie Chai">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');
    body { font-family: 'Noto Serif SC', serif; }
  </style>
</head>
<body style="background-color: #F5EBE8; color: #5D4E4E;">
  <nav class="fixed top-0 left-0 right-0 z-50 backdrop-blur-sm border-b" style="background-color: rgba(245, 235, 232, 0.95); border-color: #D4C4B5;">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="index.html" class="text-xl font-bold" style="color: #C48B9F;">Maggie</a>
      <div class="flex items-center gap-6">
        <div class="hidden md:flex gap-6">
          <a href="index.html#intro" class="transition-colors hover:text-rose-400" style="color: #8B7E7E;">关于</a>
          <a href="index.html#career" class="transition-colors hover:text-rose-400" style="color: #8B7E7E;">经历</a>
          <a href="travel.html" class="transition-colors hover:text-rose-400" style="color: #C48B9F;">旅行</a>
          <a href="campus.html" class="transition-colors hover:text-rose-400" style="color: #8B7E7E;">校园</a>
          <a href="experience.html" class="transition-colors hover:text-rose-400" style="color: #8B7E7E;">经验</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="pt-20">
    <div class="max-w-5xl mx-auto px-6">
      <section class="py-12 text-center">
        <h1 class="text-4xl font-bold mb-4" style="color: #C48B9F;">旅行足迹</h1>
        <p class="text-lg mb-6" style="color: #8B7E7E;">从北京出发，走遍世界的每个角落</p>
        <button id="startBtn" onclick="startFlight()" class="px-8 py-3 rounded-full transition-all hover:opacity-90" style="background-color: #C48B9F; color: white;">
          开始飞行
        </button>
      </section>

      <section class="rounded-2xl p-8 mb-8 shadow-sm relative overflow-hidden" style="background-color: #FFFFFF;">
        <div class="relative w-full aspect-[2/1] bg-[#F5EBE8] rounded-lg overflow-hidden">
          <svg viewBox="0 0 100 60" class="absolute inset-0 w-full h-full" preserveAspectRatio="none">
            <defs>
              <pattern id="grid" width="10" height="10" patternUnits="userSpaceOnUse">
                <path d="M 10 0 L 0 0 0 10" fill="none" stroke="#D4C4B5" stroke-width="0.2" opacity="0.3"/>
              </pattern>
              <linearGradient id="ocean" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#E8D5D0"/>
                <stop offset="100%" stop-color="#F5EBE8"/>
              </linearGradient>
            </defs>
            
            <rect width="100" height="60" fill="url(#ocean)"/>
            <rect width="100" height="60" fill="url(#grid)"/>
            
            <g fill="#E6C4CF" opacity="0.5">
              <path d="M10 15 Q15 12 20 14 L25 13 Q30 10 35 12 L40 11 Q45 8 50 10 L55 12 Q60 10 65 12 L70 14 Q75 12 80 15 L85 18 Q88 22 85 25 L80 28 Q75 30 70 28 L65 30 Q60 32 55 30 L50 28 Q45 25 40 27 L35 25 Q30 22 25 24 L20 22 Q15 18 10 15 Z"/>
              <path d="M82 28 Q85 26 88 28 L92 30 Q95 32 93 35 L90 38 Q87 40 84 38 L80 35 Q77 32 80 30 Z"/>
              <path d="M5 32 Q10 30 15 32 L20 35 Q25 38 22 40 L18 42 Q14 44 12 42 L8 40 Q5 37 5 32 Z"/>
              <path d="M25 38 Q30 36 35 38 L40 40 Q45 42 43 44 L38 46 Q33 48 30 46 L25 44 Q22 41 25 38 Z"/>
              <path d="M50 45 Q55 43 60 45 L65 48 Q70 50 68 52 L63 54 Q58 56 55 54 L50 52 Q47 49 50 45 Z"/>
              <path d="M3 48 Q8 46 12 48 L15 50 Q18 52 16 54 L12 55 Q8 56 6 54 L3 52 Q1 50 3 48 Z"/>
            </g>
            
            <g id="markers"></g>
          </svg>

          <div id="plane" class="absolute transition-all duration-700 ease-in-out" style="left: 75%; top: 35%; transform: translate(-50%, -50%);">
            <div class="text-2xl">✈️</div>
          </div>

          <div id="locationLabel" class="absolute bg-[#C48B9F] text-white px-3 py-1 rounded-full text-sm whitespace-nowrap transition-all duration-500" style="left: 75%; top: 28%; transform: translate(-50%, -50%);">
            北京
          </div>
        </div>

        <div class="mt-6 text-center">
          <p style="color: #8B7E7E;">
            当前：<span id="currentLoc" class="font-medium" style="color: #C48B9F;">北京</span>
            <span class="mx-2">·</span>
            <span id="currentCountry">中国</span>
          </p>
        </div>
      </section>

      <section class="rounded-2xl p-8 shadow-sm" style="background-color: #FFFFFF;">
        <h2 class="text-2xl font-semibold mb-6 text-center" style="color: #C48B9F;">旅行瞬间</h2>
        
        <div class="relative">
          <div class="overflow-hidden rounded-xl">
            <div id="photoSlider" class="flex transition-transform duration-500 ease-in-out" style="transform: translateX(0%);">
              <div class="w-full flex-shrink-0 px-2">
                <div class="aspect-[16/9] rounded-lg overflow-hidden relative" style="background-color: rgba(196, 139, 159, 0.2);">
                  <img src="image/travel%20(1).jpg" alt="旅行照片 1" class="w-full h-full object-cover">
                </div>
              </div>
              <div class="w-full flex-shrink-0 px-2">
                <div class="aspect-[16/9] rounded-lg overflow-hidden relative" style="background-color: rgba(196, 139, 159, 0.2);">
                  <img src="image/travel%20(2).jpg" alt="旅行照片 2" class="w-full h-full object-cover">
                </div>
              </div>
              <div class="w-full flex-shrink-0 px-2">
                <div class="aspect-[16/9] rounded-lg overflow-hidden relative" style="background-color: rgba(196, 139, 159, 0.2);">
                  <img src="image/travel%20(3).jpg" alt="旅行照片 3" class="w-full h-full object-cover">
                </div>
              </div>
              <div class="w-full flex-shrink-0 px-2">
                <div class="aspect-[16/9] rounded-lg overflow-hidden relative" style="background-color: rgba(196, 139, 159, 0.2);">
                  <img src="image/travel%20(4).jpg" alt="旅行照片 4" class="w-full h-full object-cover">
                </div>
              </div>
              <div class="w-full flex-shrink-0 px-2">
                <div class="aspect-[16/9] rounded-lg overflow-hidden relative" style="background-color: rgba(196, 139, 159, 0.2);">
                  <img src="image/travel%20(5).jpg" alt="旅行照片 5" class="w-full h-full object-cover">
                </div>
              </div>
              <div class="w-full flex-shrink-0 px-2">
                <div class="aspect-[16/9] rounded-lg overflow-hidden relative" style="background-color: rgba(196, 139, 159, 0.2);">
                  <img src="image/travel%20(6).jpg" alt="旅行照片 6" class="w-full h-full object-cover">
                </div>
              </div>
              <div class="w-full flex-shrink-0 px-2">
                <div class="aspect-[16/9] rounded-lg overflow-hidden relative" style="background-color: rgba(196, 139, 159, 0.2);">
                  <img src="image/travel%20(7).jpg" alt="旅行照片 7" class="w-full h-full object-cover">
                </div>
              </div>
              <div class="w-full flex-shrink-0 px-2">
                <div class="aspect-[16/9] rounded-lg overflow-hidden relative" style="background-color: rgba(196, 139, 159, 0.2);">
                  <img src="image/travel%20(8).jpg" alt="旅行照片 8" class="w-full h-full object-cover">
                </div>
              </div>
            </div>
          </div>

          <div class="flex justify-center gap-2 mt-4">
            <button onclick="goToSlide(0)" class="w-2 h-2 rounded-full transition-all bg-[#C48B9F] w-6"></button>
            <button onclick="goToSlide(1)" class="w-2 h-2 rounded-full transition-all bg-[#D4C4B5] hover:bg-[#C48B9F]"></button>
            <button onclick="goToSlide(2)" class="w-2 h-2 rounded-full transition-all bg-[#D4C4B5] hover:bg-[#C48B9F]"></button>
            <button onclick="goToSlide(3)" class="w-2 h-2 rounded-full transition-all bg-[#D4C4B5] hover:bg-[#C48B9F]"></button>
            <button onclick="goToSlide(4)" class="w-2 h-2 rounded-full transition-all bg-[#D4C4B5] hover:bg-[#C48B9F]"></button>
            <button onclick="goToSlide(5)" class="w-2 h-2 rounded-full transition-all bg-[#D4C4B5] hover:bg-[#C48B9F]"></button>
            <button onclick="goToSlide(6)" class="w-2 h-2 rounded-full transition-all bg-[#D4C4B5] hover:bg-[#C48B9F]"></button>
            <button onclick="goToSlide(7)" class="w-2 h-2 rounded-full transition-all bg-[#D4C4B5] hover:bg-[#C48B9F]"></button>
          </div>
        </div>

        <div class="flex justify-center gap-4 mt-4">
          <button onclick="prevSlide()" class="px-4 py-2 rounded-lg transition-all hover:opacity-80" style="background-color: #C48B9F; color: white;">
            上一张
          </button>
          <button onclick="nextSlide()" class="px-4 py-2 rounded-lg transition-all hover:opacity-80" style="background-color: #C48B9F; color: white;">
            下一张
          </button>
        </div>
      </section>
    </div>
  </main>

  <footer class="py-8 text-center text-sm mt-12" style="color: #8B7E7E;">
    <p>© 2026 Maggie Chai · 版权所有</p>
  </footer>

  <script>
    const locations = [
      { name: '北京', x: 75, y: 35, country: '中国' },
      { name: '苏黎世', x: 48, y: 28, country: '瑞士' },
      { name: '日内瓦', x: 47, y: 29, country: '瑞士' },
      { name: '采尔玛特', x: 46, y: 28, country: '瑞士' },
      { name: '伯尔尼', x: 47, y: 28, country: '瑞士' },
      { name: '卢恩赛', x: 46, y: 29, country: '瑞士' },
      { name: '因特拉肯', x: 47, y: 28, country: '瑞士' },
      { name: '马德里', x: 44, y: 32, country: '西班牙' },
      { name: '巴塞罗那', x: 45, y: 32, country: '西班牙' },
      { name: '塞维利亚', x: 43, y: 34, country: '西班牙' },
      { name: '格拉纳达', x: 44, y: 34, country: '西班牙' },
      { name: '马拉加', x: 44, y: 35, country: '西班牙' },
      { name: '东京', x: 85, y: 32, country: '日本' },
      { name: '京都', x: 83, y: 33, country: '日本' },
      { name: '大阪', x: 83, y: 33, country: '日本' },
      { name: '北海道', x: 88, y: 26, country: '日本' },
      { name: '新加坡', x: 75, y: 48, country: '新加坡' },
      { name: '亚庇', x: 78, y: 47, country: '马来西亚' },
      { name: '吉隆坡', x: 73, y: 48, country: '马来西亚' },
      { name: '马六甲', x: 72, y: 48, country: '马来西亚' },
      { name: '槟城', x: 72, y: 46, country: '马来西亚' },
      { name: '芭提雅', x: 72, y: 45, country: '泰国' },
      { name: '曼谷', x: 71, y: 45, country: '泰国' },
      { name: '清迈', x: 70, y: 43, country: '泰国' },
    ];

    let activeIndex = 0;
    let isPlaying = false;
    let timer = null;

    function renderMarkers() {
      const markersContainer = document.getElementById('markers');
      markersContainer.innerHTML = '';
      locations.forEach((loc, idx) => {
        if (idx <= activeIndex) {
          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circle.setAttribute('cx', loc.x);
          circle.setAttribute('cy', loc.y);
          circle.setAttribute('r', '2');
          circle.setAttribute('fill', '#C48B9F');
          circle.setAttribute('opacity', '0.5');
          markersContainer.appendChild(circle);
          
          const smallCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          smallCircle.setAttribute('cx', loc.x);
          smallCircle.setAttribute('cy', loc.y);
          smallCircle.setAttribute('r', '1.2');
          smallCircle.setAttribute('fill', '#C48B9F');
          markersContainer.appendChild(smallCircle);
        }
      });
    }

    function startFlight() {
      activeIndex = 0;
      isPlaying = true;
      document.getElementById('startBtn').textContent = '飞行中...';
      document.getElementById('startBtn').disabled = true;
      renderMarkers();
      flightStep();
    }

    function flightStep() {
      if (!isPlaying || activeIndex >= locations.length - 1) {
        isPlaying = false;
        document.getElementById('startBtn').textContent = '再次飞行';
        document.getElementById('startBtn').disabled = false;
        return;
      }

      const loc = locations[activeIndex];
      document.getElementById('plane').style.left = loc.x + '%';
      document.getElementById('plane').style.top = (loc.y / 60 * 100) + '%';
      document.getElementById('locationLabel').style.left = loc.x + '%';
      document.getElementById('locationLabel').style.top = ((loc.y / 60 * 100) - 10) + '%';
      document.getElementById('currentLoc').textContent = loc.name;
      document.getElementById('currentCountry').textContent = loc.country;

      activeIndex++;
      renderMarkers();
      
      timer = setTimeout(flightStep, 800);
    }

    let currentSlide = 0;
    const totalSlides = 8;

    function goToSlide(index) {
      currentSlide = index;
      document.getElementById('photoSlider').style.transform = `translateX(-${index * 100}%)`;
      
      const dots = document.querySelectorAll('[onclick^="goToSlide"]');
      dots.forEach((dot, idx) => {
        if (idx === index) {
          dot.classList.remove('bg-[#D4C4B5]');
          dot.classList.add('bg-[#C48B9F]', 'w-6');
        } else {
          dot.classList.remove('bg-[#C48B9F]', 'w-6');
          dot.classList.add('bg-[#D4C4B5]');
        }
      });
    }

    function nextSlide() {
      currentSlide = (currentSlide + 1) % totalSlides;
      goToSlide(currentSlide);
    }

    function prevSlide() {
      currentSlide = (currentSlide - 1 + totalSlides) % totalSlides;
      goToSlide(currentSlide);
    }

    renderMarkers();
  </script>
</body>
</html>
